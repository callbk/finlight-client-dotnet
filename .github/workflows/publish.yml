name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for NuGet trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test -c Release

      - name: Pack
        run: >
          dotnet pack src/Finlight.Client -c Release -o out
          -p:Version=$VERSION -p:ContinuousIntegrationBuild=true

      # Exchanges the workflow's OIDC token for a short-lived API key.
      # Requires a trusted publishing policy on nuget.org for
      # callbk/finlight-client-dotnet with this workflow file.
      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: callbk # nuget.org profile that owns the publishing policy

      - name: Push to NuGet
        run: >
          dotnet nuget push "out/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
