name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write # OIDC for NuGet trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Version from tag matches the project
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PROJECT=$(grep -oE '<Version>[^<]+' src/Finlight.Client/Finlight.Client.csproj | cut -d'>' -f2)
          if [ "$VERSION" != "$PROJECT" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match project version $PROJECT"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Contract kit matches its MANIFEST
        run: scripts/sync-conformance.sh --check

      - name: Test
        run: dotnet test Finlight.Client.slnx -c Release

      - name: Pack into an empty folder
        run: |
          rm -rf out
          dotnet pack src/Finlight.Client -c Release -o out -p:Version=$VERSION -p:ContinuousIntegrationBuild=true
          for pkg in out/*.nupkg out/*.snupkg; do
            if unzip -l "$pkg" | grep -Eiq 'conformance/|local/|tests?/|fixtures/|\.env'; then
              echo "::error::$pkg contains files that must not ship"; exit 1
            fi
          done

      # Exchanges the workflow's OIDC token for a short-lived API key.
      # Requires a trusted publishing policy on nuget.org for
      # callbk/finlight-client-dotnet with this workflow file.
      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: callbk # nuget.org profile that owns the publishing policy

      - name: Push to NuGet
        run: >
          dotnet nuget push "out/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
